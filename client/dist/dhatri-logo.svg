<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Lotus & Crescent Emblem -->
  <g transform="translate(10, 8)">
    <!-- Soft Glow Background -->
    <circle cx="32" cy="32" r="28" fill="#F6D6D9" fill-opacity="0.5" />
    
    <!-- Outer Crescent/Womb of Care -->
    <path d="M16 36 C14 22, 26 12, 40 12 C43 12, 46 13, 48 14 C36 16, 26 26, 26 38 C26 48, 34 54, 44 54 C32 54, 18 48, 16 36 Z" fill="#702B4C" />
    
    <!-- Botanical Lotus Center Petals -->
    <!-- Center petal -->
    <path d="M32 18 C30 26, 28 34, 32 44 C36 34, 34 26, 32 18 Z" fill="#D96F89" />
    <!-- Left petal -->
    <path d="M32 26 C24 28, 20 36, 24 44 C27 40, 29 34, 32 32 Z" fill="#F8C5CE" />
    <!-- Right petal -->
    <path d="M32 26 C40 28, 44 36, 40 44 C37 40, 35 34, 32 32 Z" fill="#D96F89" />
    
    <!-- Sage Green Base Leaf Accent -->
    <path d="M22 46 C28 50, 36 50, 42 46 C38 48, 26 48, 22 46 Z" fill="#81977C" />
    <circle cx="32" cy="16" r="2.5" fill="#702B4C" />
  </g>

  <!-- Typography -->
  <!-- Devanagari Script धात्री -->
  <text x="82" y="36" font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="28" font-weight="700" fill="#702B4C" letter-spacing="0.5">
    Dhatri
  </text>
  <!-- Devanagari Script pill -->
  <rect x="176" y="16" width="60" height="24" rx="12" fill="#F6D6D9" fill-opacity="0.8" />
  <text x="206" y="32" font-family="'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="600" fill="#702B4C" text-anchor="middle">
    धात्री
  </text>
  
  <!-- Tagline -->
  <text x="83" y="54" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#81977C" letter-spacing="0.8">
    YOUR WELLNESS BESTIE
  </text>
</svg>
